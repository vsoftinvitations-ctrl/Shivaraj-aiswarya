  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none;
        opacity: 1;
        animation: none
      }

      .calligraphy-spark {
        display: none
      }

      .flourish-path {
        stroke-dashoffset: 0;
        animation: none
      }

      .script-amp .amp {
        opacity: 1;
        transform: none;
        animation: none
      }
    }

    .orn {
      display: block;
      margin: 28px auto;
      color: var(--gold);
      width: 140px;
      max-width: 60%
    }

    .rule {
      width: 64px;
      height: 1px;
      background: var(--gold);
      margin: 28px auto
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.2rem, 4.3vw, 1.55rem);
      line-height: 1.6;
      color: var(--ink);
      max-width: 480px;
      margin: 0 auto
    }

    .big {
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      line-height: 1.15;
      letter-spacing: .02em
    }

    .day {
      font-size: .85rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500
    }

    .body {
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      line-height: 1.9;
      color: var(--ink);
      max-width: 520px;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      letter-spacing: .1em;
      color: var(--mute)
    }

    .alt {
      background: var(--cream)
    }

    /* Invocations */
    .invocations {
      text-align: center;
      margin: 0 auto 28px;
      line-height: 1.85;
      font-family: var(--serif);
      color: var(--gold);
      letter-spacing: .08em;
    }

    .invocations span {
      display: block;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      font-weight: 500;
    }

    /* Couple Union Card */
    .couple-card {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--gold-soft);
      border-radius: 18px;
      padding: clamp(28px, 6vw, 44px) clamp(20px, 5vw, 36px);
      box-shadow: 0 10px 30px rgba(60, 50, 30, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin: 32px auto 0;
      max-width: 520px;
    }

    .couple-profile {
      text-align: center;
    }

    .couple-tag {
      display: inline-block;
      font-size: .7rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .couple-title {
      font-family: var(--serif);
      font-size: clamp(1.7rem, 6vw, 2.3rem);
      color: var(--ink);
      font-weight: 500;
      line-height: 1.25;
      margin: 0 0 10px;
    }

    .couple-parents {
      font-size: 1.05rem;
      color: var(--ink);
      font-weight: 400;
      margin: 0 0 4px;
    }

    .couple-lineage {
      font-size: .92rem;
      color: var(--mute);
      font-style: italic;
      margin: 0 0 4px;
    }

    .couple-place {
      font-size: .92rem;
      color: var(--mute);
      margin: 0;
      line-height: 1.5;
    }

    .weds-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 26px auto;
      position: relative;
    }

    .weds-divider::before,
    .weds-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--gold-soft);
      max-width: 80px;
    }

    .weds-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.15rem;
      letter-spacing: .15em;
      color: var(--gold);
      background: var(--ivory);
      border: 1px solid var(--gold-soft);
      border-radius: 999px;
      padding: 4px 18px;
      margin: 0 12px;
      font-weight: 400;
    }

    /* Muhurtha & Lagna badge */
    .muhurtha-box {
      margin: 28px auto 0;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--gold-soft);
      border-radius: 14px;
      padding: 16px 32px;
      box-shadow: 0 6px 20px rgba(60, 50, 30, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .muhurtha-lagna {
      font-size: .95rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }

    .muhurtha-time {
      font-family: var(--serif);
      font-size: clamp(1.35rem, 4.5vw, 1.8rem);
      color: var(--ink);
      font-weight: 500;
      line-height: 1.2;
    }

    /* Invitation From Box */
    .inv-from-box {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--gold-soft);
      border-radius: 16px;
      padding: clamp(26px, 6vw, 42px) clamp(20px, 5vw, 32px);
      box-shadow: 0 8px 24px rgba(60, 50, 30, 0.05);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      margin: 0 auto;
    }

    /* hero */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      overflow: hidden;
      box-sizing: border-box;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      cursor: pointer;
    }

    #hero.leaving {
      pointer-events: none;
      animation: heroFadeOut 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes heroFadeOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.03);
      }
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(2.5px) brightness(0.72);
      transform: translate3d(0, 0, 0) scale(1.08);
      -webkit-transform: translate3d(0, 0, 0) scale(1.08);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      z-index: -2;
      transition: transform 6s ease-out;
    }

    #hero:hover .hero-bg {
      transform: translate3d(0, 0, 0) scale(1.12);
    }

    #hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(30, 24, 16, 0.38) 0%, rgba(20, 15, 10, 0.75) 100%);
      z-index: -1;
    }

    .hero-initial {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: opacity, transform;
    }

    .hero-initial.hide {
      opacity: 0;
      transform: scale(0.96) translateY(-8px);
      pointer-events: none;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 8.5vw, 4rem);
      color: #fffdf8;
      letter-spacing: .06em;
      margin: 0 0 28px;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8), 0 0 30px rgba(220, 201, 160, 0.4);
      line-height: 1.2;
    }

    .hero-writing {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      width: 100%;
      max-width: 580px;
      opacity: 0;
      transition: opacity 0.35s ease;
      will-change: opacity;
    }

    .hero-writing.active {
      display: flex;
      opacity: 1;
    }

    .hero-writing-label {
      font-size: .75rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold-soft);
      font-weight: 500;
      margin: 0 0 16px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: opacity 0.85s cubic-bezier(.25, 1, .5, 1), transform 0.85s cubic-bezier(.25, 1, .5, 1), visibility 0.85s;
    }

    .hero-writing.step-label .hero-writing-label {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .hero-writing .script-groom .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .hero-writing.step-groom .script-groom .script-text {
      animation: writeGroom 1.25s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing.step-groom .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.25s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing .script-amp .amp {
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      transition: opacity 0.45s cubic-bezier(.34, 1.56, .64, 1), transform 0.45s cubic-bezier(.34, 1.56, .64, 1);
    }

    .hero-writing.step-amp .script-amp .amp {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .hero-writing .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .hero-writing.step-bride .script-bride .script-text {
      animation: writeBride 1.25s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing.step-bride .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.25s cubic-bezier(.35, 0, .25, 1) forwards;
    }

    .hero-writing .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .hero-writing.step-flourish .flourish-path {
      animation: drawFlourish 0.8s cubic-bezier(.25, 1, .5, 1) forwards;
    }

    #hero .date {
      color: #fffdf8;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    }

    #hero .day {
      color: var(--gold-soft);
      letter-spacing: .34em;
    }

    #hero .tag {
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
    }

    #hero .script-text {
      color: #fffaf0;
      text-shadow: 0 2px 24px rgba(220, 201, 160, 0.65), 0 0 12px rgba(255, 255, 255, 0.35);
    }

    #hero .script-amp .amp {
      color: var(--gold-soft);
      text-shadow: 0 2px 16px rgba(184, 152, 90, 0.7);
    }

    .btn-tap {
      position: relative;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      border: 1px solid var(--gold);
      border-radius: 999px;
      min-height: unset;
      height: 38px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 26px;
      font: 500 .68rem var(--sans);
      letter-spacing: .25em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35), 0 0 12px rgba(218, 165, 32, 0.25);
      animation: btnPulse 2.4s ease-in-out infinite;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      transition: transform .35s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
    }

    /* Generous touch target padding */
    .btn-tap::after {
      content: "";
      position: absolute;
      inset: -14px -24px;
      cursor: pointer;
    }

    .btn-tap:hover {
      background: rgba(255, 255, 255, 0.26);
      border-color: #eed79b;
      transform: scale(1.04);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45), 0 0 20px rgba(218, 165, 32, 0.45);
    }

    @keyframes btnPulse {
      0%, 100% {
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), 0 0 12px rgba(218, 165, 32, 0.22);
        border-color: rgba(212, 175, 55, 0.75);
        transform: scale(1);
      }
      50% {
        background: rgba(255, 255, 255, 0.22);

  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love, blessings and warm regards</p>
  ${orn}
</div></section>`;

    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Live Wedding Countdown Timer ===== */
    const targetDate = new Date(W.date.countdownTarget).getTime();
    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        ['cd-days', 'cd-hours', 'cd-mins', 'cd-secs'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.textContent = '00';
        });
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      const dEl = document.getElementById('cd-days');
      const hEl = document.getElementById('cd-hours');
      const mEl = document.getElementById('cd-mins');
      const sEl = document.getElementById('cd-secs');

      if (dEl) dEl.textContent = String(days).padStart(2, '0');
      if (hEl) hEl.textContent = String(hours).padStart(2, '0');
      if (mEl) mEl.textContent = String(mins).padStart(2, '0');
      if (sEl) sEl.textContent = String(secs).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude & Smooth Opening Sequence ===== */
    history.scrollRestoration = 'manual';
    scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';

    let openingStarted = false;
    let sequenceStartTime = 0;
    let opened = false;
    let sequenceTimeouts = [];

    function clearSequenceTimeouts() {
      sequenceTimeouts.forEach(t => clearTimeout(t));
      sequenceTimeouts = [];
    }

    function addStepTimeout(fn, delay) {
      const id = setTimeout(fn, delay);
      sequenceTimeouts.push(id);
      return id;
    }

    function startOpeningSequence() {
      if (openingStarted) return;
      openingStarted = true;
      sequenceStartTime = Date.now();

      playAudio();

      const heroInitial = document.getElementById('hero-initial');
      const heroWriting = document.getElementById('hero-writing');

      if (heroInitial) {
        heroInitial.classList.add('hide');
      }

      addStepTimeout(() => {
        if (heroInitial) heroInitial.style.display = 'none';
        if (heroWriting) {
          heroWriting.classList.add('active');

          // Step 1: "Together with their families" fades down
          addStepTimeout(() => {
            heroWriting.classList.add('step-label');
          }, 80);

          // Step 2: "Shivaraju" writes in Brittany Signature
          addStepTimeout(() => {
            heroWriting.classList.add('step-groom');
          }, 450);

          // Step 3: "&" reveals
          addStepTimeout(() => {
            heroWriting.classList.add('step-amp');
          }, 1650);

          // Step 4: "Aishwarya" writes in Brittany Signature
          addStepTimeout(() => {
            heroWriting.classList.add('step-bride');
          }, 2050);

          // Step 5: Golden flourish draws under names
          addStepTimeout(() => {
            heroWriting.classList.add('step-flourish');
          }, 3250);

          // Step 6: "Sunday" & "06 December 2026" rises into view
          addStepTimeout(() => {
            heroWriting.classList.add('step-date');
          }, 3900);

          // Step 7: Smooth transition to main invitation
          addStepTimeout(() => {
            openInviteSlowly();
          }, 5600);
        }
      }, 200);
    }

    function openInviteSlowly() {
      if (opened) return;
      opened = true;
      clearSequenceTimeouts();

      const hero = document.getElementById('hero');
      if (hero) {
        hero.classList.add('leaving');
        // Once fade-out completes, remove #hero from rendering pipeline
        setTimeout(() => {
          hero.style.display = 'none';
        }, 950);
      }

      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      // Initialize scroll reveal smoothly
      requestAnimationFrame(() => {
        document.querySelectorAll('.r').forEach(el => io.observe(el));
      });
    }

    /* ===== Universal Tap Handling (Debounced, smooth on touch & mouse) ===== */
    let lastTapTime = 0;
    function handleOpenTrigger(e) {
      const now = Date.now();
      if (now - lastTapTime < 400) {
        if (e && e.cancelable) e.preventDefault();
        return;
      }
      lastTapTime = now;

      if (e) {
        if (e.stopPropagation) e.stopPropagation();
        if (e.cancelable && e.type !== 'touchmove') {
          e.preventDefault();
        }
      }

      if (!openingStarted) {
        startOpeningSequence();
      } else if (!opened && (now - sequenceStartTime > 1200)) {
        // If guest taps after writing has begun, allow advancing cleanly
        openInviteSlowly();
      }
    }

    const btnOpen = document.getElementById('btn-open');
    if (btnOpen) {
      btnOpen.addEventListener('click', handleOpenTrigger);
      btnOpen.addEventListener('touchend', handleOpenTrigger, { passive: false });
    }

    const heroEl = document.getElementById('hero');
    if (heroEl) {
      heroEl.addEventListener('click', e => {
        if (e.target !== btnOpen) handleOpenTrigger(e);
      });
      heroEl.addEventListener('touchend', e => {
        if (e.target !== btnOpen) handleOpenTrigger(e);
      }, { passive: false });

      // Swipe up support: if guest scrolls/swipes up, open smoothly
      let touchStartY = 0;
      heroEl.addEventListener('touchstart', e => {
        if (e.touches && e.touches[0]) touchStartY = e.touches[0].clientY;
      }, { passive: true });

      heroEl.addEventListener('touchmove', e => {
        if (e.touches && e.touches[0]) {
          const deltaY = touchStartY - e.touches[0].clientY;
          if (deltaY > 25) {
            handleOpenTrigger(e);
          }
        }
      }, { passive: true });
    }

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');

    function playAudio() {
      if (!audio) return;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>
